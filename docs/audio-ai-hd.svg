<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" font-family="Segoe UI, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#868e96"/>
    </marker>
    <marker id="ar-audio" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/>
    </marker>
    <marker id="ar-ai" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#7048e8"/>
    </marker>
    <marker id="ar-coil" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0ca678"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/><text x="28" y="36" font-size="17" fill="#212529" font-weight="600" text-anchor="start">HD 触觉的三条触发通路</text><rect x="28" y="80" width="180" height="70" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/><text x="44" y="106" font-size="13" fill="#1971c2" font-weight="600" text-anchor="start">游戏音频</text><text x="44" y="128" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">PipeWire monitor</text><rect x="300" y="70" width="300" height="92" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.4"/><text x="316" y="94" font-size="13" fill="#0ca678" font-weight="600" text-anchor="start">① 音圈直通 passthrough</text><text x="316" y="116" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">25–200 Hz 带通 × 规则增益</text><text x="316" y="136" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">音圈重放游戏自己的波形 →</text><text x="316" y="154" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">材质质感天然不同（碎石/金属/水）</text><rect x="300" y="196" width="300" height="84" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/><text x="316" y="220" font-size="13" fill="#e8590c" font-weight="600" text-anchor="start">② 瞬态 onset（~20 ms）</text><text x="316" y="242" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">fast/slow 包络差，对背景音量免疫</text><text x="316" y="262" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">onset &gt; 0.55 &amp;&amp; loudness &gt; 0.35</text><rect x="300" y="314" width="300" height="84" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4"/><text x="316" y="338" font-size="13" fill="#7048e8" font-weight="600" text-anchor="start">③ AI 事件确认（~150 ms）</text><text x="316" y="360" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">crossed("audio_gunshot", 0.30)</text><text x="316" y="380" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">边沿触发：一次事件只响一次</text><rect x="700" y="70" width="260" height="108" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.4"/><text x="716" y="96" font-size="13" fill="#0ca678" font-weight="600" text-anchor="start">音圈 Ch3/4（HD）</text><text x="716" y="118" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">mode: passthrough</text><text x="716" y="138" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">haptic_left / haptic_right = 增益</text><text x="716" y="158" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">gain 0.7 · low 55Hz · high 200Hz</text><rect x="700" y="200" width="260" height="80" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/><text x="716" y="224" font-size="13" fill="#e8590c" font-weight="600" text-anchor="start">马达（体量）</text><text x="716" y="246" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">rumble_left / rumble_right</text><text x="716" y="266" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">枪声/爆炸的"咚"</text><rect x="700" y="314" width="260" height="84" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.4"/><text x="716" y="338" font-size="13" fill="#c2255c" font-weight="600" text-anchor="start">扳机（操作感）</text><text x="716" y="360" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">rigid 挡墙 + weapon "咔哒"</text><text x="716" y="380" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">L2 45% / R2 70%，按住 14Hz 连发</text><line x1="208" y1="108" x2="292" y2="108" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><path d="M600,116 L646,116 L646,116 L692,116" fill="none" stroke="#0ca678" stroke-width="1.8" marker-end="url(#ar-coil)"/><path d="M600,238 L646,238 L646,238 L692,238" fill="none" stroke="#0ca678" stroke-width="1.8" marker-end="url(#ar-coil)"/><path d="M600,356 L646,356 L646,348 L692,348" fill="none" stroke="#0ca678" stroke-width="1.8" marker-end="url(#ar-coil)"/><text x="614" y="232" font-size="10.5" fill="#0ca678" font-weight="400" text-anchor="start">音圈</text><text x="614" y="350" font-size="10.5" fill="#e8590c" font-weight="400" text-anchor="start">马达</text><text x="28" y="448" font-size="12" fill="#6c757d" font-weight="400" text-anchor="start">互斥规则：单发路径要求 r2 &lt; 0.80；按住时只保留一条 14 Hz 节奏（优先级 48），</text><text x="28" y="470" font-size="12" fill="#6c757d" font-weight="400" text-anchor="start">否则瞬态 26 Hz、连发 14 Hz、AI 突发三种频率会互相打架（加特林"抖得没规律"）。</text></svg>
