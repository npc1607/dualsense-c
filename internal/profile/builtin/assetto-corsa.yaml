# Assetto Corsa / ACC / Assetto Corsa Rally —— 共享内存 + Proton 桥
#
# 链路：
#   游戏（Proton 内的 Windows 进程）→ acpmf_physics 共享内存
#     → ds5bridge.exe（同一 Proton 前缀内运行）→ UDP 127.0.0.1:9999
#     → ds5d（Linux 原生）→ DualSense 物理手柄
#
# 一键启停（两段式）：
#   ./scripts/ds5-acr.sh start           # 启动 Linux 原生 ds5d 守护进程
#   在 Steam 中启动 ACR 并进入赛道
#   ./scripts/ds5-acr.sh bridge          # 游戏启动后注入桥连接共享内存
#   ./scripts/ds5-acr.sh status          # 查看遥测与桥连接状态
#   ./scripts/ds5-acr.sh stop            # 干净关闭并释放手柄
#
# 基于 ACR 413 帧真实遥测数据科学采样标定的 24 层物理力学全景融合体系：
#   1. 踏板力学：
#      - L2: 无助力赛车单回路液压刹车曲线（前段微空行程、中段线性陡增、后段 255 刚性液压墙）
#      - R2: 柔性抗疲劳渐进油门弹簧曲线
#   2. 动力总成两段式机体共振：
#      - 中转速巡航（4200~6800 RPM）：细腻机械巡航颗粒感
#      - 高转速红线（6800+ RPM，实测 top 15%）：双侧对称 58Hz 红线电光蓝换挡微颤
#   3. 生理直觉辅助系统分离：
#      - 左手掌：L2 液压刹车联动 ABS 抱死 15Hz 急促方波打手感
#      - 右手掌：R2 油门联动 TC 牵引力打滑 32Hz 平滑震颤
#   4. 直驱模拟器 (Direct Drive FFB) 力矩降维：
#      - 160Hz 轮胎抓地力极限边缘物理嘶鸣 (lat_g > 0.03 & 0.18 < slip < 0.70)
#      - 24Hz 推头力矩骤降松脱警告 (slip_front >= 0.70)
#      - 26Hz 大角度漂移甩尾饱满滑移力感 (slip > 0.60)
#   5. 铺装路 vs 砂石路实测分位点断层解构：
#      - 铺装平稳段（accel_g <= 0.015G，实测占 63.2%）：左马达静音，右小马达提供超细腻高速微晶沥青胎噪（65Hz）
#      - 砂石粗糙段（0.015 < accel_g <= 0.06G，实测占 31.4%）：
#        * 浮沙微滑移剪切磨削（0.18 < slip <= 0.60）：左马达 24Hz 传递泥沙切削颗粒感
#        * 左右马达对称沉降颠簸拍频（35Hz vs 54Hz）
#      - 路肩切击（0.06 < accel_g <= 0.15G）：双马达 30Hz/44Hz 方波硬核碎震（hold 70ms）
#      - 飞坡落地与硬碰撞重锤（accel_g > 0.15G，实测 top 5%）：双马达 255 满幅方波重拳（hold 130ms）
#   6. 3D 砂石敲击立体声双音圈（Stereo Voice Coils）：
#      - 左音圈 52Hz + 右音圈 40Hz（形成 12Hz 触觉声学拍频，逼真呈现砂石敲击底盘颗粒）
#      - 音圈瞬态路肩切击 ＋ 255 满幅飞坡触底重锤
#   7. 交互式座舱仪表灯条：
#      - 油门绿、刹车赛车红、接近 8000 转红线电光蓝换挡提示。

name: assetto-corsa
title: Assetto Corsa / ACC / AC Rally（共享内存桥，UDP 9999）
description: |
  通过 Proton 前缀内的 ds5bridge.exe 读取 acpmf_physics：
  基于实测遥测数据分位点标定：铺装路微晶路感 ＋ 砂石浮沙磨削 ＋ 3D 碎石拍频，
  无助力液压刹车 ＋ 渐进油门，左手 ABS 弹手 / 右手 TC 打滑直觉分离，
  双频段发动机巡航/红线共振，160Hz 直驱极限啸叫与推头松脱，
  飞坡落地重锤防触底与电光蓝红线换挡灯条。

source:
  type: udp
  listen: "127.0.0.1:9999"
  decoder: acshm
  rate_hz: 60

safety:
  signal_ttl: 500ms
  release: 250ms
  status_lightbar: true

# 双音圈触感输出（USB Audio 声卡 Ch3/4）
haptics:
  target: auto
  carrier_hz: 52
  gain: 0.95

rules:
  # ======================================================================
  # 1. 踏板力学：L2 无助力液压刹车 + R2 渐进油门
  # ======================================================================

  # ---- 刹车 → L2 无助力液压踏板刚度曲线 --------------------------------
  # 前段微小空行程，中段踏板力线性陡增，后段坚挺刚性液压墙 (力矩 235~255)
  - name: l2-brake
    when: 'has("brake")'
    target: l2
    effect: rigid
    priority: 10
    params:
      start: "0"
      force: "clamp(curve(brake, 0.0, 18.0, 0.05, 36.0, 0.50, 160.0, 0.85, 235.0, 1.0, 255.0), 0, 255)"

  # ---- 油门 → R2 柔性渐进弹簧手感 --------------------------------------
  # 前段轻盈易于细致控油，后段饱满回弹，长赛段手指不疲劳
  - name: r2-throttle
    when: 'has("throttle")'
    target: r2
    effect: rigid
    priority: 10
    params:
      start: "0"
      force: "clamp(curve(throttle, 0.0, 8.0, 0.15, 25.0, 0.60, 85.0, 1.0, 150.0), 0, 255)"

  # ======================================================================
  # 2. 动力总成：两段式发动机巡航微粒 + 红线微颤共振
  # ======================================================================

  # ---- 中转速巡航（4200~6800 RPM，实测中位数 5664）：细腻机械巡航颗粒感 -
  - name: engine-grain-mid
    when: "custom0 > 4200 && custom0 <= 6800"
    target: rumble_right
    priority: 15
    value: "clamp(55 * (custom0 - 4200) / 2600, 0, 65)"
    modulate: { type: sine, hz: 45, depth: 0.45 }

  # ---- 高转速红线（6800+ RPM，实测 p85~p99 换挡区间）：双侧对称微颤 ---
  - name: engine-redline-left
    when: "custom0 > 6800"
    target: rumble_left
    priority: 25
    value: "clamp(110 * (custom0 - 6800) / 1200, 0, 130)"
    modulate: { type: sine, hz: 58, depth: 0.65 }

  - name: engine-redline-right
    when: "custom0 > 6800"
    target: rumble_right
    priority: 25
    value: "clamp(110 * (custom0 - 6800) / 1200, 0, 130)"
    modulate: { type: sine, hz: 58, depth: 0.65 }

  # ======================================================================
  # 3. 生理直觉分离：左手 ABS 刹车抱死 + 右手 TC 牵引力控制
  # ======================================================================

  # ---- ABS 介入 → 左手马达 15Hz 急促方波脉冲 (直觉联动 L2 刹车) --------
  - name: abs-pulse-left
    when: "abs > 0.05"
    target: rumble_left
    priority: 30
    hold: 50ms
    value: "clamp(190 * abs, 0, 255)"
    modulate: { type: square, hz: 15, depth: 0.85 }

  # ---- TC 牵引力控制介入 → 右手马达平滑震颤 (直觉联动 R2 油门) --------
  - name: tc-rumble-right
    when: "tc > 0.05"
    target: rumble_right
    priority: 22
    value: "clamp(130 * tc, 0, 200)"
    modulate: { type: sine, hz: 32, depth: 0.60 }

  # ---- 大角度深度甩尾滑移 → 左马达饱满滑移力感 (实测 slip > 0.60 进漂移) -
  - name: deep-drift-rumble
    when: "slip > 0.60"
    target: rumble_left
    priority: 20
    value: "clamp(220 * smoothstep(0.60, 2.50, slip), 0, 210)"
    modulate: { type: sine, hz: 26, depth: 0.70 }

  # ======================================================================
  # 4. 直驱模拟器 (Direct Drive FFB) 力矩降维与极限抓地力
  # ======================================================================

  # ---- 轮胎抓地力临界音圈高频微颤 (Grip Boundary Vibration) -----------
  # 模拟直驱方向盘在轮胎达到摩擦力极限边缘时的物理高频嘶鸣微颤 (160Hz)
  - name: dd-grip-limit-vibe
    when: 'has("lat_g") && absf(lat_g) > 0.03 && max(slip_fl, slip_fr) > 0.18 && max(slip_fl, slip_fr) < 0.70'
    target: haptic_left
    priority: 32
    value: "clamp(220 * smoothstep(0.18, 0.65, max(slip_fl, slip_fr)), 0, 210)"
    modulate: { type: sine, hz: 160, depth: 0.75 }

  # ---- 推头失抓力矩骤降 (Understeer Drop) 瞬间松脱与右马达警示 --------
  # 超过极限滑移（推头）后，力矩急剧软化，触发 24Hz 方波松脱提示脉冲
  - name: dd-understeer-drop
    when: 'max(slip_fl, slip_fr) >= 0.70 && absf(lat_g) > 0.04'
    target: rumble_right
    priority: 35
    hold: 80ms
    value: "clamp(180 * smoothstep(0.70, 2.0, max(slip_fl, slip_fr)), 0, 220)"
    modulate: { type: square, hz: 24, depth: 0.80 }

  # ======================================================================
  # 5. 路面场景解构一：铺装路（Tarmac / 沥青，实测占 63.2%）极细腻微晶路感
  # ======================================================================

  # ---- 铺装沥青路面：底盘平稳（accel_g <= 0.015G），右马达随速细腻微颤 ---
  - name: tarmac-surface-right
    when: 'has("accel_g") && speed > 5 && absf(accel_g) <= 0.015'
    target: rumble_right
    priority: 15
    value: "clamp(4 + 35 * sqrt(max(absf(accel_g), 0.0001)) + 12 * (speed / 120), 0, 32)"
    modulate: { type: sine, hz: 65, depth: 0.50 }

  # ======================================================================
  # 6. 路面场景解构二：砂石粗糙路面（Gravel / Dirt，实测占 31.4%）
  # ======================================================================

  # ---- 砂石路面低附着剪切磨削感（浮沙/碎石微滑移 0.18~0.60）----------
  # 车辆在砂石上开跑时四轮始终伴随微滑移，左马达传递泥沙切削的“沙沙”颗粒感
  - name: gravel-micro-scrub
    when: 'speed > 10 && slip > 0.18 && slip <= 0.60'
    target: rumble_left
    priority: 18
    value: "clamp(100 * smoothstep(0.18, 0.60, slip), 0, 100)"
    modulate: { type: sine, hz: 24, depth: 0.75 }

  # ---- 砂石颠簸起伏：右小马达高频细石颠簸 (0.015 < accel_g <= 0.06G) --
  - name: gravel-bumps-right
    when: 'has("accel_g") && speed > 5 && absf(accel_g) > 0.015 && absf(accel_g) <= 0.06'
    target: rumble_right
    priority: 16
    value: "clamp(18 + 240 * (absf(accel_g) - 0.015), 0, 120)"
    modulate: { type: sine, hz: 54, depth: 0.65 }

  # ---- 砂石路面下陷沉降：左大马达低频车身沉降重量感 (0.015 < accel_g <= 0.06G) -
  - name: gravel-heave-left
    when: 'has("accel_g") && speed > 5 && absf(accel_g) > 0.015 && absf(accel_g) <= 0.06'
    target: rumble_left
    priority: 16
    value: "clamp(18 + 250 * (absf(accel_g) - 0.015), 0, 125)"
    modulate: { type: sine, hz: 35, depth: 0.60 }

  # ======================================================================
  # 7. 3D 砂石敲击底盘：立体声双音圈拍频 (Stereo Voice Coils)
  # ======================================================================

  # ---- 前轮悬挂阻尼速度 → 左音圈 52Hz 前桥细颗粒 ---------------------
  - name: coil-texture-left
    when: 'has("accel_g") && speed > 5'
    target: haptic_left
    priority: 18
    value: "clamp(8 + 420 * absf(accel_g), 0, 180)"
    modulate: { type: sine, hz: 52, depth: 0.60 }

  # ---- 后轮抓地与碎石飞溅 → 右音圈 40Hz 后轴纹理 ---------------------
  # 与左音圈 52Hz 产生 12Hz 自然声学拍频，逼真呈现砂石敲击底盘颗粒
  - name: coil-texture-right
    when: 'has("accel_g") && speed > 5'
    target: haptic_right
    priority: 18
    value: "clamp(6 + 380 * absf(accel_g), 0, 170)"
    modulate: { type: sine, hz: 40, depth: 0.55 }

  # ---- 路肩 / 搓板碎震：音圈瞬态高频冲击 -----------------------------
  - name: coil-kerb-left
    when: 'has("accel_g") && absf(accel_g) > 0.06 && absf(accel_g) < 30'
    target: haptic_left
    priority: 30
    hold: 60ms
    value: "clamp(150 + 70 * (absf(accel_g) - 0.06), 0, 255)"

  - name: coil-kerb-right
    when: 'has("accel_g") && absf(accel_g) > 0.06 && absf(accel_g) < 30'
    target: haptic_right
    priority: 30
    hold: 60ms
    value: "clamp(130 + 65 * (absf(accel_g) - 0.06), 0, 245)"

  # ---- 撞击与防触底重锤：音圈满幅爆发 ---------------------------------
  - name: coil-impact
    when: 'has("accel_g") && absf(accel_g) > 0.15 && absf(accel_g) < 30'
    target: haptic_left
    priority: 65
    hold: 140ms
    value: "255"

  # ======================================================================
  # 8. 极端地形冲击：路肩切击与飞坡撞击重锤 (实测 top 5%)
  # ======================================================================

  # ---- 路肩 / 搓板颠簸：双马达方波硬核碎震 (0.06 < accel_g <= 0.15G) ---
  - name: kerb-left
    when: 'has("accel_g") && absf(accel_g) > 0.06 && absf(accel_g) <= 0.15'
    target: rumble_left
    priority: 28
    hold: 70ms
    value: "clamp(160 + 150 * (absf(accel_g) - 0.06), 0, 235)"
    modulate: { type: square, hz: 30, depth: 0.80 }

  - name: kerb-right
    when: 'has("accel_g") && absf(accel_g) > 0.06 && absf(accel_g) <= 0.15'
    target: rumble_right
    priority: 28
    hold: 70ms
    value: "clamp(150 + 140 * (absf(accel_g) - 0.06), 0, 220)"
    modulate: { type: square, hz: 44, depth: 0.80 }

  # ---- 飞坡落地与硬碰撞重锤：双马达方波重击 (accel_g > 0.15G) ----------
  - name: impact-left
    when: 'has("accel_g") && absf(accel_g) > 0.15 && absf(accel_g) < 30'
    target: rumble_left
    priority: 60
    hold: 130ms
    value: "clamp(170 + 45 * (absf(accel_g) - 0.15), 0, 255)"
    modulate: { type: square, hz: 16, depth: 0.55 }

  - name: impact-right
    when: 'has("accel_g") && absf(accel_g) > 0.15 && absf(accel_g) < 30'
    target: rumble_right
    priority: 60
    hold: 130ms
    value: "clamp(160 + 45 * (absf(accel_g) - 0.15), 0, 255)"
    modulate: { type: square, hz: 22, depth: 0.55 }

  # ======================================================================
  # 9. 交互式座舱仪表灯条
  # ======================================================================

  # 刹车赛车红、油门翠绿、接近红线电光蓝换挡提示
  - name: lightbar
    target: lightbar
    priority: 1
    params:
      r: "clamp(255 * brake, 0, 255)"
      g: "clamp(255 * throttle, 0, 255)"
      b: "clamp(255 * smoothstep(0.85, 0.98, custom0 / 8000), 0, 255)"
