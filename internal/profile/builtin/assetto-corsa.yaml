# Assetto Corsa / ACC / Assetto Corsa Rally —— 共享内存 + Proton 桥
#
# 链路：
#   游戏（Proton 内的 Windows 进程）→ acpmf_physics 共享内存
#     → ds5bridge.exe（同一 Proton 前缀内运行）→ UDP 127.0.0.1:9999
#     → ds5d（Linux 原生）→ DualSense 物理手柄
#
# 一键启停：
#   ./scripts/ds5-acr.sh start           # 自动拉起 ds5d 并将桥注入 Proton 前缀
#   ./scripts/ds5-acr.sh status          # 查看遥测与桥连接状态
#   ./scripts/ds5-acr.sh stop            # 干净关闭并释放手柄
#
# 架构融合特色（全面融合拉力与直驱全套体验）：
#   1. 踏板手感：
#      - L2: 无助力赛车单回路液压刹车曲线（前段微空行程、中段陡增、后段 255 刚性液压墙）
#      - R2: 柔性抗疲劳渐进油门弹簧曲线 + 6600+ 转高转速红线换挡微颤
#   2. 直驱模拟器 FFB 降维力学：
#      - 轮胎抓地力临界音圈高频啸叫（160Hz 摩擦极限微颤）
#      - 推头失抓松脱警示（Understeer Drop 24Hz 脉冲）
#   3. 立体声双音圈 3D 砂石颗粒：
#      - 左音圈 52Hz + 右音圈 40Hz（形成 12Hz 触觉声学拍频，逼真呈现砂石路面与底盘敲击）
#   4. 车辆动力学与冲击防触底：
#      - 四轮滑移磨削感（Slip Smoothstep）+ TC / ABS 独立方波脉冲
#      - 飞坡落地与撞击重锤（左右马达 16Hz/22Hz 方波重拳，hold 130ms）
#   5. 交互式座舱仪表灯条：
#      - 油门绿、刹车赛车红、接近红线电光蓝换挡提示。

name: assetto-corsa
title: Assetto Corsa / ACC / AC Rally（共享内存桥，UDP 9999）
description: |
  通过 Proton 前缀内的 ds5bridge.exe 读取 acpmf_physics：
  无助力液压刹车 ＋ 渐进柔性油门，160Hz 直驱抓地力极限微颤与推头松脱，
  立体声双音圈 52Hz/40Hz 砂石拍频纹理，底盘颠簸左右互补拍频，
  ABS / TC 独立脉冲，飞坡落地重锤防触底与电光蓝红线换挡灯条。

source:
  type: udp
  listen: "127.0.0.1:9999"
  decoder: acshm
  rate_hz: 60

safety:
  signal_ttl: 500ms
  release: 250ms
  status_lightbar: true

# 双音圈触感输出（USB Audio 声卡 Ch3/4）
haptics:
  target: auto
  carrier_hz: 52
  gain: 0.95

rules:
  # ======================================================================
  # 1. 踏板力学：L2 无助力液压刹车 + R2 渐进油门
  # ======================================================================

  # ---- 刹车 → L2 无助力液压踏板刚度曲线 --------------------------------
  # 前段微小空行程，中段踏板力线性陡增，后段坚挺刚性液压墙 (力矩 235~255)
  - name: l2-brake
    when: 'has("brake")'
    target: l2
    effect: rigid
    priority: 10
    params:
      start: "0"
      force: "clamp(curve(brake, 0.0, 18.0, 0.05, 36.0, 0.50, 160.0, 0.85, 235.0, 1.0, 255.0), 0, 255)"

  # ---- 油门 → R2 柔性渐进弹簧手感 --------------------------------------
  # 前段轻盈易于细致控油，后段饱满回弹，长赛段手指不疲劳
  - name: r2-throttle
    when: 'has("throttle")'
    target: r2
    effect: rigid
    priority: 10
    params:
      start: "0"
      force: "clamp(curve(throttle, 0.0, 8.0, 0.15, 25.0, 0.60, 85.0, 1.0, 150.0), 0, 255)"

  # ---- 发动机红线转速回馈 → 右马达高频轻震 ----------------------------
  # custom0 为原始引擎转速，逼近红线时给予细腻微颤提示最佳升挡时机
  - name: engine-redline-vibe
    when: "custom0 > 6600"
    target: rumble_right
    priority: 25
    value: "clamp(120 * (custom0 - 6600) / 1200, 0, 140)"
    modulate: { type: sine, hz: 58, depth: 0.65 }

  # ======================================================================
  # 2. 直驱模拟器 (Direct Drive FFB) 力矩降维与极限抓地力
  # ======================================================================

  # ---- 轮胎抓地力临界音圈高频微颤 (Grip Boundary Vibration) -----------
  # 模拟直驱方向盘在轮胎达到最大摩擦力极限边缘时的物理高频嘶鸣微颤 (160Hz)
  - name: dd-grip-limit-vibe
    when: 'has("lat_g") && absf(lat_g) > 0.35 && max(slip_fl, slip_fr) > 0.35 && max(slip_fl, slip_fr) < 1.4'
    target: haptic_left
    priority: 32
    value: "clamp(220 * smoothstep(0.35, 0.85, max(slip_fl, slip_fr)), 0, 210)"
    modulate: { type: sine, hz: 160, depth: 0.75 }

  # ---- 推头失抓力矩骤降 (Understeer Drop) 瞬间松脱与右马达警示 --------
  # 超过极限滑移（推头）后，力矩急剧软化，触发 24Hz 方波松脱提示脉冲
  - name: dd-understeer-drop
    when: 'max(slip_fl, slip_fr) >= 1.4 && absf(lat_g) > 0.5'
    target: rumble_right
    priority: 35
    hold: 80ms
    value: "clamp(180 * smoothstep(1.4, 2.8, max(slip_fl, slip_fr)), 0, 220)"
    modulate: { type: square, hz: 24, depth: 0.80 }

  # ======================================================================
  # 3. 辅助系统与滑移反馈 (ABS / TC / Wheel Slip)
  # ======================================================================

  # ---- ABS 介入 → 右马达 15Hz 急促方波脉冲 -----------------------------
  - name: abs-pulse
    when: "abs > 0.05"
    target: rumble_right
    priority: 30
    hold: 50ms
    value: "clamp(190 * abs, 0, 255)"
    modulate: { type: square, hz: 15, depth: 0.85 }

  # ---- TC 牵引力控制介入 → 右马达平滑震颤 -----------------------------
  - name: tc-rumble
    when: "tc > 0.05"
    target: rumble_right
    priority: 22
    value: "clamp(130 * tc, 0, 200)"
    modulate: { type: sine, hz: 32, depth: 0.60 }

  # ---- 车轮滑移与甩尾磨削 → 左马达 26Hz 滑移触感 ---------------------
  # 归一化平滑映射，避免长时间饱和掩盖路面细节
  - name: slip-rumble
    when: "slip > 0.8"
    target: rumble_left
    priority: 20
    value: "clamp(210 * smoothstep(0.8, 3.0, slip), 0, 210)"
    modulate: { type: sine, hz: 26, depth: 0.70 }

  # ======================================================================
  # 4. 砂石与路面细节：立体声双音圈 3D 拍频 (Stereo Voice Coils)
  # ======================================================================

  # ---- 前轮悬挂阻尼速度 → 左音圈 52Hz 前桥细颗粒 ---------------------
  - name: coil-texture-left
    when: 'has("accel_g") && speed > 5'
    target: haptic_left
    priority: 18
    value: "clamp(8 + 420 * absf(accel_g), 0, 180)"
    modulate: { type: sine, hz: 52, depth: 0.60 }

  # ---- 后轮抓地与碎石飞溅 → 右音圈 40Hz 后轴纹理 ---------------------
  # 与左音圈 52Hz 产生 12Hz 自然声学拍频，呈现 3D 砂石敲击底盘颗粒
  - name: coil-texture-right
    when: 'has("accel_g") && speed > 5'
    target: haptic_right
    priority: 18
    value: "clamp(6 + 380 * absf(accel_g), 0, 170)"
    modulate: { type: sine, hz: 40, depth: 0.55 }

  # ---- 路肩 / 搓板碎震：音圈瞬态高频冲击 -----------------------------
  - name: coil-kerb-left
    when: 'has("accel_g") && absf(accel_g) > 0.35 && absf(accel_g) < 30'
    target: haptic_left
    priority: 30
    hold: 60ms
    value: "clamp(150 + 70 * (absf(accel_g) - 0.35), 0, 255)"

  - name: coil-kerb-right
    when: 'has("accel_g") && absf(accel_g) > 0.35 && absf(accel_g) < 30'
    target: haptic_right
    priority: 30
    hold: 60ms
    value: "clamp(130 + 65 * (absf(accel_g) - 0.35), 0, 245)"

  # ---- 撞击与防触底重锤：音圈满幅爆发 ---------------------------------
  - name: coil-impact
    when: 'has("accel_g") && absf(accel_g) > 1.5 && absf(accel_g) < 30'
    target: haptic_left
    priority: 65
    hold: 140ms
    value: "255"

  # ======================================================================
  # 5. 底盘垂直载荷与路面体感 (HID 左右马达互补沉降)
  # ======================================================================

  # ---- 铺装路面细颗粒：右马达承担高频细密微颤 -------------------------
  - name: road-texture-right
    when: 'has("accel_g") && speed > 5'
    target: rumble_right
    priority: 16
    value: "clamp(6 + 50 * sqrt(max(absf(accel_g), 0.0001)) + 260 * absf(accel_g), 0, 120)"
    modulate: { type: sine, hz: 54, depth: 0.65 }

  # ---- 粗糙路面颠簸：左大马达负责低频车身沉降重量感 -------------------
  - name: road-texture-left
    when: 'has("accel_g") && speed > 5 && absf(accel_g) > 0.12'
    target: rumble_left
    priority: 16
    value: "clamp(30 + 260 * (absf(accel_g) - 0.12), 0, 140)"
    modulate: { type: sine, hz: 35, depth: 0.60 }

  # ---- 路肩 / 颠簸：双马达方波碎震 (hold 70ms 保证瞬态感知) ----------
  - name: kerb-left
    when: 'has("accel_g") && absf(accel_g) > 0.35 && absf(accel_g) < 30'
    target: rumble_left
    priority: 28
    hold: 70ms
    value: "clamp(170 + 150 * (absf(accel_g) - 0.35), 0, 235)"
    modulate: { type: square, hz: 30, depth: 0.80 }

  - name: kerb-right
    when: 'has("accel_g") && absf(accel_g) > 0.35 && absf(accel_g) < 30'
    target: rumble_right
    priority: 28
    hold: 70ms
    value: "clamp(155 + 140 * (absf(accel_g) - 0.35), 0, 220)"
    modulate: { type: square, hz: 44, depth: 0.80 }

  # ---- 飞坡落地与硬碰撞重锤：双马达方波重击 ---------------------------
  - name: impact-left
    when: 'has("accel_g") && absf(accel_g) > 1.5 && absf(accel_g) < 30'
    target: rumble_left
    priority: 60
    hold: 130ms
    value: "clamp(160 + 45 * (absf(accel_g) - 1.5), 0, 255)"
    modulate: { type: square, hz: 16, depth: 0.55 }

  - name: impact-right
    when: 'has("accel_g") && absf(accel_g) > 1.5 && absf(accel_g) < 30'
    target: rumble_right
    priority: 60
    hold: 130ms
    value: "clamp(150 + 45 * (absf(accel_g) - 1.5), 0, 255)"
    modulate: { type: square, hz: 22, depth: 0.55 }

  # ======================================================================
  # 6. 交互式座舱仪表灯条
  # ======================================================================

  # 刹车赛车红、油门翠绿、接近红线电光蓝换挡提示
  - name: lightbar
    target: lightbar
    priority: 1
    params:
      r: "clamp(255 * brake, 0, 255)"
      g: "clamp(255 * throttle, 0, 255)"
      b: "clamp(255 * smoothstep(0.85, 0.98, custom0 / 8000), 0, 255)"
