<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" font-family="Segoe UI, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#868e96"/>
    </marker>
    <marker id="ar-audio" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1971c2"/>
    </marker>
    <marker id="ar-ai" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#7048e8"/>
    </marker>
    <marker id="ar-coil" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0ca678"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/><text x="28" y="36" font-size="17" fill="#212529" font-weight="600" text-anchor="start">音频 AI 推理流程（source/audio → YAMNet → rules → 音圈）</text><rect x="28" y="70" width="200" height="84" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/><text x="44" y="96" font-size="13" fill="#1971c2" font-weight="600" text-anchor="start">parec 16 kHz</text><text x="44" y="118" font-size="12" fill="#6c757d" font-weight="400" text-anchor="start">monitor 环回采集</text><text x="44" y="138" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">--latency-msec=20</text><rect x="28" y="188" width="200" height="76" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.4"/><text x="44" y="214" font-size="12" fill="#212529" font-weight="600" text-anchor="start">Read 256 帧 (16 ms)</text><text x="44" y="236" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">consume()</text><rect x="282" y="188" width="210" height="108" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/><text x="298" y="212" font-size="13" fill="#1971c2" font-weight="600" text-anchor="start">measure()</text><text x="298" y="234" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">bass / mid / loudness</text><text x="298" y="254" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">onset = (fast−slow)/slow</text><text x="298" y="276" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">3× biquad 带通</text><rect x="282" y="320" width="210" height="76" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.4"/><text x="298" y="346" font-size="12" fill="#212529" font-weight="600" text-anchor="start">feedAI(): 16000 样本环</text><text x="298" y="368" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">每 classify_ms(120) 取一窗</text><rect x="546" y="320" width="250" height="132" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4"/><text x="562" y="346" font-size="13" fill="#7048e8" font-weight="600" text-anchor="start">classifyLoop() goroutine</text><text x="562" y="368" font-size="12" fill="#212529" font-weight="400" text-anchor="start">ortEngine.Classify(win)</text><text x="562" y="388" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">tensor [16000] f32 → Run()</text><text x="562" y="408" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">输出 [frames, 521] → 求平均</text><text x="562" y="430" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">类别名映射 → 每信号取最高分</text><rect x="546" y="486" width="250" height="96" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4"/><text x="562" y="510" font-size="12" fill="#7048e8" font-weight="600" text-anchor="start">AI 信号 (aiCh, 只保留最新)</text><text x="562" y="532" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">surface_water/metal/wood/gravel</text><text x="562" y="550" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">audio_gunshot/explosion/impact</text><text x="562" y="568" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">每帧(60Hz)并入信号集</text><rect x="846" y="188" width="130" height="108" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.4"/><text x="860" y="212" font-size="13" fill="#212529" font-weight="600" text-anchor="start">规则引擎</text><text x="860" y="234" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">when 表达式</text><text x="860" y="254" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">crossed()/has()</text><text x="860" y="276" font-size="11" fill="#6c757d" font-weight="400" text-anchor="start">优先级覆盖</text><rect x="846" y="330" width="130" height="60" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.4"/><text x="860" y="354" font-size="12" fill="#0ca678" font-weight="600" text-anchor="start">音圈 Ch3/4</text><text x="860" y="374" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">haptic_*</text><rect x="846" y="404" width="130" height="60" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/><text x="860" y="428" font-size="12" fill="#e8590c" font-weight="600" text-anchor="start">马达</text><text x="860" y="448" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">rumble_*</text><rect x="846" y="480" width="130" height="60" rx="8" fill="#fff0f6" stroke="#c2255c" stroke-width="1.4"/><text x="860" y="504" font-size="12" fill="#c2255c" font-weight="600" text-anchor="start">扳机</text><text x="860" y="524" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">l2 / r2</text><line x1="228" y1="112" x2="274" y2="112" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><line x1="274" y1="112" x2="274" y2="214" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><line x1="228" y1="226" x2="274" y2="226" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><line x1="492" y1="236" x2="538" y2="236" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><line x1="538" y1="236" x2="538" y2="300" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><line x1="492" y1="356" x2="538" y2="356" stroke="#7048e8" stroke-width="1.8" marker-end="url(#ar-ai)"/><line x1="796" y1="386" x2="838" y2="386" stroke="#7048e8" stroke-width="1.8" marker-end="url(#ar-ai)"/><line x1="796" y1="534" x2="838" y2="534" stroke="#7048e8" stroke-width="1.8" marker-end="url(#ar-ai)"/><line x1="492" y1="300" x2="520" y2="300" stroke="#1971c2" stroke-width="1.8" marker-end="url(#ar-audio)"/><path d="M520,300 L520,470 L838,470" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="530" y="462" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="start">onset 直连（不等 AI）</text><text x="28" y="594" font-size="12" fill="#6c757d" font-weight="400" text-anchor="start">延迟：采集 ≈37 ms · 瞬态路径 ≈44 ms · AI 路径 ≈150 ms（窗口末端在"现在"）</text></svg>
